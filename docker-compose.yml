version: '3.8'

services:
  server:
    build: 
      context: ./server
      dockerfile: Dockerfile
    container_name: edemy_server
    ports:
      - "5000:5000"
    environment:
      # This points to the Redis container below using Docker's internal networking
      - REDIS_URL=redis://redis:6379
    env_file:
      - ./server/.env
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: edemy_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  redis_data:
